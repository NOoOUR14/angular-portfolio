<div class="align-items-center default-container" appScrollReveal>
    <div class="content col-lg-8">
        <div class="row justify-content-center">
            @for(project of projects; track project.id) {
                <div class="col-lg-4 col-md-6 mb-4" style="max-width: 390px; min-width: 390px">
                    <app-project-card [card]="project"></app-project-card>
                </div>
            } @empty {
                <div class="text-center">
                    <p>No projects available.</p>
                </div>
            }
        </div>
    </div>
</div>
